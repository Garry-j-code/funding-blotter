name: daily blotter

on:
  schedule:
    # 03:30 UTC = 23:30 New York during EDT (22:30 during EST).
    # Only runs if your Mac self-hosted runner is online.
    - cron: "30 3 * * *"
  workflow_dispatch: # also triggered from the blotter "Fetch today's deals" button
    inputs:
      reason:
        description: "Why this run was triggered"
        required: false
        default: "manual"

permissions:
  contents: write # commit refreshed page + DB back to the repo
  actions: read

concurrency:
  group: blotter
  cancel-in-progress: false

jobs:
  build:
    # Must be your Mac (home IP). GitHub-hosted runners are blocked by FinSMEs' Cloudflare.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=0
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::error::TAVILY_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets present. Runner: $(uname -s) $(hostname)"

      - name: Build blotter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run python -m src.main

      - name: Commit results
        run: |
          git config user.name  "blotter-bot"
          git config user.email "blotter-bot@users.noreply.github.com"
          git add data/deals.db data/deals.csv docs/index.html
          if git diff --staged --quiet; then
            echo "No new rounds today."
          else
            git commit -m "blotter: $(date -u +'%Y-%m-%d')"
            git push
          fi
