name: daily blotter

on:
  schedule:
    # 03:30 UTC = 23:30 New York during EDT (22:30 during EST).
    # GitHub cron is always UTC and can drift by a few minutes under load.
    - cron: "30 3 * * *"
  workflow_dispatch: # trigger by hand from the Actions tab

permissions:
  contents: write # commit refreshed page + DB back to the repo

concurrency:
  group: blotter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build blotter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run python -m src.main

      - name: Commit results
        run: |
          git config user.name  "blotter-bot"
          git config user.email "blotter-bot@users.noreply.github.com"
          git add data/deals.db data/deals.csv docs/index.html
          if git diff --staged --quiet; then
            echo "No new rounds today."
          else
            git commit -m "blotter: $(date -u +'%Y-%m-%d')"
            git push
          fi
