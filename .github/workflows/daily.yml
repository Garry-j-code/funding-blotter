name: daily blotter

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered"
        required: false
        default: "manual"
      runner:
        description: "Which self-hosted machine should run this?"
        required: true
        default: any
        type: choice
        options:
          - any
          - mac
          - windows

permissions:
  contents: read
  actions: read

concurrency:
  group: blotter
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner == 'mac' && fromJson('["self-hosted", "mac"]') || inputs.runner == 'windows' && fromJson('["self-hosted", "windows"]') || fromJson('["self-hosted"]') }}
    steps:
      - name: Ensure Git Bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\Git\bin',
            'C:\Program Files (x86)\Git\bin',
            'C:\Program Files\Git\usr\bin'
          )
          $gitBin = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $gitBin) {
            throw @'
Git for Windows is required (workflow uses bash).
1. Install: https://git-scm.com/download/win
2. Restart the runner service (or close run.cmd and start it again)
'@
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBin
          Write-Host "Added to PATH: $gitBin"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in GROQ_API_KEY TAVILY_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets present. Runner: $(uname -s) $(hostname)"

      - name: Build blotter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python -m src.main --backend supabase
