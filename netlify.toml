[build]
  command = "npm ci && npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# API routes are served by functions via export const config.path (deals, health, fetch).
# SPA fallback only — must not catch /api/* (functions take precedence).

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
