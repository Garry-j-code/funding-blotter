# Funding Blotter configuration
# Everything you'd want to tune lives here. No code changes needed.

sources:
  finsmes:
    enabled: true
    # FinSMEs' /feed and /wp-json endpoints are WAF-blocked (403), but the
    # rendered category and article pages serve normally. The finsmes adapter
    # lists a category page, then fetches each post for its templated body.
    kind: finsmes
    urls:
      - https://www.finsmes.com/category/usa
    # Re-scan today + this many prior calendar days so afternoon posts aren't
    # missed after a morning-only run. Pagination stops when a listing page's
    # newest post is older than that window (day-before-yesterday at default 1).
    lookback_days: 1
    # Safety cap only — normal stop is date-based.
    max_pages: 15
    # Pause between article downloads.
    article_delay: 0.4
    # FinSMEs uses a rigid sentence template, so the regex fast path
    # handles most of its entries without spending any LLM tokens.
    template_hint: finsmes

  aifunding_me:
    enabled: true
    kind: html
    # VERIFY ON FIRST RUN. This site is not WordPress and has no confirmed
    # feed, so the adapter probes for a JSON endpoint before falling back
    # to HTML. Run `python -m src.main --probe aifunding_me` to see what it
    # actually finds and adjust the selectors below.
    urls:
      - https://aifunding.me/deals
    json_probe:
      - https://aifunding.me/api/deals
      - https://aifunding.me/deals.json
    selectors:
      row: "table tbody tr, [class*='deal-row'], [class*='deal-card']"
      link: "a"
    template_hint: generic

extraction:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  # Simple field extraction from templated text. Groq replaced llama-3.1-8b-instant
  # (Aug 2026) with openai/gpt-oss-20b — same tier, good free-tier headroom.
  # Swap to openai/gpt-oss-120b if you see bad parses.
  model: openai/gpt-oss-20b
  # Free tier is TPM-limited (~6k/min), so batch and pace rather than
  # firing one request per article.
  batch_size: 8
  chars_per_item: 700
  seconds_between_calls: 6
  max_retries: 4
  # Regex handles FinSMEs' template locally and skips the LLM for those.
  # Set false to send every item through the model instead.
  regex_fastpath: true

enrichment:
  # Agentic sector filter. For each company the LLM is given a web_search tool;
  # it looks up what the company does (via Tavily), then labels it. Only the
  # keep_labels below survive — everything else is dropped from the blotter.
  # Classifications are cached in the DB so daily runs don't re-spend.
  enabled: true
  provider: tavily
  max_results: 3
  # Pause between per-company tool-call loops (rate-limit headroom).
  seconds_between_searches: 1.0
  keep_labels:
    - ai_fintech
    - fintech
    - financial_services
    - enabler

filters:
  # Soft ranking on top of the hard enrichment filter. Non-matches that still
  # passed enrichment are stored; priority flags sector+location hits.
  priority_sectors:
    - fintech
    - financial
    - capital markets
    - trading
    - asset management
    - banking
    - payments
    - wealth
    - insurance
    - risk
    - compliance
    - kyc
    - aml
    - quant
    - artificial intelligence
    - machine learning
    - agentic
    - llm
    - data infrastructure
    - securities
    - finance
    - brokerage
    - custody
    - clearing
    - settlement
    - market making
    - execution
    - fixed income
    - derivatives
    - treasury
    - lending
    - underwriting
    - private credit
    - regtech
    - wealthtech
    - insurtech
    - embedded finance
    - neobank
    - stablecoin
  priority_locations:
    - new york
    - nyc
    - ny
    - brooklyn
    - manhattan
  # Rounds matching these are stored but pushed to the bottom and dimmed.
  # Biotech is the bulk of FinSMEs' volume and almost never relevant to you.
  deprioritize:
    - biotech
    - biotechnology
    - therapeutics
    - pharmaceutical
    - clinical-stage
    - oncology
    - medical device
    - diagnostics
    - vaccine
    - cannabis
    - real estate
    - restaurant
    - apparel
    - beverage
    - sports
    - entertainment
    - staffing
    - aerospace
    - satellite

output:
  html_path: docs/index.html
  csv_path: data/deals.csv
  # How many days of history the page shows.
  window_days: 30
  # Used by the "Fetch today's deals" button on the blotter page.
  github_owner: Garry-j-code
  github_repo: funding-blotter
  workflow_file: daily.yml

store:
  db_path: data/deals.db
  backend: supabase  # sqlite for local dev; supabase for production pipeline
  # Two sources reporting the same round within this many days are treated
  # as one deal.
  dedupe_window_days: 21

jobs:
  # Open roles pulled from each company's public job board (Ashby, Greenhouse,
  # Lever, Workable). Titles are matched with regexes (case-insensitive). The
  # FIRST role that matches becomes the primary role_type; every match is kept
  # in `tags`. Edit these lists to change what counts as a relevant role.
  roles:
    - role_type: forward_deployed_engineer
      patterns:                         # also needs "engineer/engineering/developer" in the title,
        - 'forward[- ]deployed'         # so "Forward Deployed Banker" / "... Auditor" do not match
        - '\bFDE\b'
    - role_type: ai_product_engineer
      patterns:
        - '\bai\b.*product (engineer|developer)s?\b'
        - 'product (engineer|developer)s?\b.*\bai\b'
    - role_type: product_engineer
      patterns:
        - 'product (engineer|developer)s?\b'
    - role_type: ai_engineer
      # Strict: "AI Engineer" and direct variants only. Not ML Engineer, AI Security/Operations
      # Engineer, or generic "Software Engineer, AI" titles.
      patterns:
        - '\b(ai|a\.i\.|genai|gen ai|generative ai|llm)\s*(/\s*ml\s+|&\s*ml\s+)?(software\s+|full[- ]?stack\s+|backend\s+)?(engineer|developer)s?\b'
        - '\bai/ml (engineer|developer)s?\b'
        - '\bapplied (ai|ml) (engineer|developer)s?\b'
  # A title containing any of these is never a match (not an engineering role).
  exclude_title: '\b(manager|director|head of|recruiter|recruiting|sales|account executive|marketing|vice president|vp)\b'
  workers: 4                  # parallel companies
  # Minimum seconds between requests to the same host, shared by all workers. Workable throttles
  # hard (HTTP 429), so it is slower and is only asked after the other systems found nothing.
  host_min_interval:
    default: 0.15
    apply.workable.com: 1.2
  workable_max_candidates: 2  # only the first N name guesses are tried on Workable
  rate_limit_trip_after: 6    # this many exhausted 429s in a row pauses that host for the rest of the run
  rate_limit_cooldown: 300    # seconds a paused host stays paused
  # A 429 whose Retry-After is longer than this pauses the host at once (for that long) instead of
  # waiting. Workable has answered 'retry in ~24 hours' after a burst of requests.
  rate_limit_max_wait: 120
  max_slug_candidates: 6      # board-name guesses tried per company
  retry_no_board_days: 7      # re-try discovery for companies with no board this often
  new_badge_days: 7           # a role is "new" for this many days after first seen
  max_error_rate: 0.2         # exit non-zero if more than this share of fetches fail
